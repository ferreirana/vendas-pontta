services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vendas
      POSTGRES_USER: vendas
      POSTGRES_PASSWORD: vendas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendas -d vendas"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vendas
      SPRING_DATASOURCE_USERNAME: vendas
      SPRING_DATASOURCE_PASSWORD: vendas
    ports:
      - "8080:8080"

volumes:
  pgdata:
