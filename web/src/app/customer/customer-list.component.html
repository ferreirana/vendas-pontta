<main class="main">
    <div class="top">
        <h1>Clientes</h1>
        <a class="btn" routerLink="/customers/new">Novo Cliente</a>
    </div>
    <section class="card">
      <label>Buscar por nome<input type="search" placeholder="Digite o nome do cliente" (input)="onSearch($event)"></label>
        @if (error()) {
            <p class="msg">{{ (error()) }}</p>
        }
        <div class="scroll">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                    </tr>
                </thead>
                <tbody>
                    @for (
                        c of customers();
                        track c.id){
                            <tr>
                                <td>
                                    {{ c.name }}
                                </td>
                                <td>
                                    {{ c.email }}
                                </td>
                            </tr>
                            <td>
                                <a class = "lnk" [routerLink] = "['/customers'], c.id">
                                    Editar
                                </a>
                                <button class="lnk" type="button" (click)="remove(c)"> 
                                    Excluir
                                </button>
                            </td>
                        } @empty {
                            <tr>
                                <td colspan="5"> Nenhum cliente cadastrado</td>
                            </tr>
                        }
                </tbody>
            </table>
        </div>
    </section>
  </div>
</main>
